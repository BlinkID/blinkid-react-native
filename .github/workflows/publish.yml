name: Publish to NPM

on:
  push:
    tags:
      - 'v*' # Triggered on version tag push when creating a GitHub Release

permissions:
  id-token: write # Required for npm OIDC Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('./BlinkID/package.json')).version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version (v$TAG) does not match BlinkID/package.json version ($PKG)"
            exit 1
          fi
          echo "Version match verified: v$TAG"

      - name: Prepare Package Subfolder
        run: cp README.md BlinkID/

      - name: Install Dependencies
        working-directory: BlinkID
        run: npm install

      - name: Publish to npm
        working-directory: BlinkID
        run: npm publish --access public
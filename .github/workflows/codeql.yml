name: CodeQL SAST Scan

on:
  push:
    branches:
      - master
      # Temporary: run on this branch so we can time jobs before adding iOS.
      - feature/MSDKS-2201-implement-gh-codeql
  pull_request:
    branches: [ "master" ]
  schedule:
    # Run a full scan every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ${{ matrix.os }}

    permissions:
      packages: read
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest
          # Android first: same Linux runner as JS/TS, no Xcode/signing.
          # Kotlin requires a real compile (build-mode: none skips .kt files).
          - language: java-kotlin
            build-mode: manual
            os: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Java
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      if: matrix.language == 'java-kotlin'
      uses: android-actions/setup-android@v3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: Build Android sample with local BlinkID
      if: matrix.language == 'java-kotlin'
      env:
        CI: true
      run: bash .github/scripts/codeql-build-android.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
